<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Tareas</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333333;
        }

        #btn-nueva {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .tarea-item {
            background-color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <h1>Lista de Tareas</h1>

    <button id="btn-nueva">
        Nueva tarea
    </button>

    <div class="tarea-item">
        Estudiar Selenium
    </div>

    <div class="tarea-item">
        Realizar pruebas E2E
    </div>

</body>

</html>
